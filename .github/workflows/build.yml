name: Build Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Android APK ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - name: Create google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.flutter_notes"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyPlaceholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Fix quill_native_bridge_windows GMEM_MOVEABLE
        run: |
          QNBW=$(find ~/.pub-cache -path "*/quill_native_bridge_windows-*/lib/quill_native_bridge_windows.dart" | head -1)
          if [ -n "$QNBW" ]; then
            sed -i 's/GlobalAlloc(GMEM_MOVEABLE,/GlobalAlloc(0x0002,/g' "$QNBW"
            echo "Patched GMEM_MOVEABLE in $QNBW"
          fi

      - name: Fix msal_flutter missing namespace
        run: |
          MSAL_BUILD=$(find ~/.pub-cache -path "*/msal_flutter-*/android/build.gradle" | head -1)
          if [ -n "$MSAL_BUILD" ] && ! grep -q "namespace" "$MSAL_BUILD"; then
            MSAL_MANIFEST=$(find ~/.pub-cache -path "*/msal_flutter-*/android/src/main/AndroidManifest.xml" | head -1)
            NS=$(grep -oP 'package="\K[^"]+' "$MSAL_MANIFEST")
            sed -i "s/^android {/android {\n    namespace '$NS'/" "$MSAL_BUILD"
            echo "Patched namespace '$NS' into $MSAL_BUILD"
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # ── Windows EXE ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Fix quill_native_bridge_windows GMEM_MOVEABLE
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse "$env:LOCALAPPDATA\Pub\Cache" `
            -Filter "quill_native_bridge_windows.dart" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($file) {
            $content = Get-Content $file.FullName -Raw
            $patched = $content -replace 'GlobalAlloc\(GMEM_MOVEABLE,', 'GlobalAlloc(0x0002,'
            Set-Content $file.FullName $patched
            Write-Host "Patched GMEM_MOVEABLE in $($file.FullName)"
          }

      - run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "flutter_notes_windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: flutter_notes_windows.zip
          retention-days: 7

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "name=v$VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          files: |
            artifacts/app-release.apk
            artifacts/flutter_notes_windows.zip
          generate_release_notes: true
