name: Build OpenOptions

on:
  push:
    paths:
      - 'openoptions/**'
      - '.github/workflows/openoptions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openoptions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (HID++ core)
        run: ./gradlew --no-daemon :core:hidpp:test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openoptions-spike-debug
          path: openoptions/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidpp-core-test-report
          path: openoptions/core/hidpp/build/reports/tests/test
          if-no-files-found: ignore
