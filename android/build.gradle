buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
gradle.afterProject { p ->
    if (p.hasProperty('android') && p.name == 'msal_flutter') {
        p.android.compileSdkVersion 35
        p.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    // AGP 8+ requires every Android module to declare a namespace. Older
    // plugins (e.g. msal_flutter 2.0.1) still rely on the legacy
    // AndroidManifest `package` attribute — read it back here so the build
    // doesn't fail on configure.
    if (p.hasProperty('android') && p.android.namespace == null) {
        def manifest = new File(p.projectDir, 'src/main/AndroidManifest.xml')
        if (manifest.exists()) {
            def pkg = new XmlSlurper().parse(manifest).@package.text()
            if (pkg) {
                p.android.namespace = pkg
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
